<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EduPlatform{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f9; color: #333; }
        header { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: white; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1100px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        footer { text-align: center; padding: 20px; color: #7f8c8d; font-size: 14px; margin-top: 5px; }
        .btn { display: inline-block; background: #2ecc71; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; background: #e67e22; color: white; }
    </style>
</head>
<body>

<header>
    <h1>EduPlatform</h1>
    <nav>
        <a href="/">Все курсы</a>
    </nav>
</header>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<footer>
    <p>&copy; 2026 Платформа онлайн-курсов. Все права защищены.</p>
</footer>

</body>
</html>
